services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: troca-moedas-dev
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      - app-data:/app/data
    environment:
      - TERM=xterm-256color
      - DOTNET_CLI_TELEMETRY_OPTOUT=1
      - DOTNET_NOLOGO=1
      - EXCHANGE_RATE_API_KEY=${EXCHANGE_RATE_API_KEY:-}
      - EXCHANGE_RATE_CACHE_TTL_MINUTES=${EXCHANGE_RATE_CACHE_TTL_MINUTES:-60}

volumes:
  app-data:
