services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: troca-moedas:prod
    container_name: troca-moedas-prod
    # App de terminal: rode anexado (docker compose -f docker-compose.prod.yml up)
    # Sem `restart: unless-stopped`: o processo termina quando o usuário sai e
    # um restart reabriria o app em loop (sem stdin quando rodando em -d).
    restart: "no"
    stdin_open: true
    tty: true
    init: true
    volumes:
      - prod-data:/app/data
    environment:
      - TERM=xterm-256color
      - DOTNET_CLI_TELEMETRY_OPTOUT=1
      - DOTNET_NOLOGO=1
      - EXCHANGE_RATE_API_KEY=${EXCHANGE_RATE_API_KEY:-}
      - EXCHANGE_RATE_CACHE_TTL_MINUTES=${EXCHANGE_RATE_CACHE_TTL_MINUTES:-60}

volumes:
  prod-data:
    name: troca-moedas-prod-data
